<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="google" content="notranslate" />
  <meta name="content-language" content="en" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/flubber/0.4.2/flubber.min.js"></script>
  <title>A.D.</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background-color: #EADBD4;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      font-family: 'Georgia', serif;
    }

    .header {
      position: fixed;
      top: 0; left: 0; right: 0;
      height: 80px;
      z-index: 100;
      display: flex;
      align-items: center;
      padding: 0 48px;
      pointer-events: none;
    }
    .header-name {
      font-family: 'Georgia', serif;
      font-size: 15px;
      letter-spacing: 0.12em;
      color: #2A5360;
      text-transform: uppercase;
      pointer-events: all;
    }

    .nav-bubbles {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 20px;
      align-items: center;
      z-index: 100;
    }
    .nav-bubble {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      width: 90px;
      height: 56px;
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .nav-bubble:hover { transform: scale(1.1); }
    .nav-bubble svg {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      overflow: visible;
    }
    .nav-bubble svg path {
      fill: #E1CDC7;
      opacity: 0.78;
      transition: opacity 0.3s ease;
    }
    .nav-bubble:hover svg path { opacity: 1; }
    .nav-bubble span {
      position: relative;
      z-index: 1;
      font-family: 'Georgia', serif;
      font-size: 11px;
      letter-spacing: 0.09em;
      color: #2A5360;
      text-transform: uppercase;
    }

    .chat-history {
      position: fixed;
      top: 80px;
      bottom: 120px;
      left: 0; right: 0;
      overflow-y: auto;
      pointer-events: all;
      z-index: 1;
      opacity: 0;
      transition: opacity 0.4s ease;
      -webkit-mask-image: linear-gradient(to bottom, transparent 0px, black 50px, black calc(100% - 60px), transparent 100%);
      mask-image: linear-gradient(to bottom, transparent 0px, black 50px, black calc(100% - 60px), transparent 100%);
    }
    .chat-history.visible { opacity: 1; }
    .chat-history:not(.visible) { pointer-events: none; }
    .chat-history::-webkit-scrollbar { width: 3px; }
    .chat-history::-webkit-scrollbar-track { background: transparent; }
    .chat-history::-webkit-scrollbar-thumb { background: #D4C1B3; border-radius: 10px; }
    .chat-history::-webkit-scrollbar-thumb:hover { background: #04757B; }

    .messages-wrap {
      display: flex;
      flex-direction: column;
      gap: 18px;
      min-height: 100%;
      justify-content: flex-end;
      padding: 20px 60px 180px;
      overflow: visible;
    }

    .message {
      display: flex;
      opacity: 0;
      animation: msgIn 0.5s ease forwards;
    }
    .message.user { justify-content: flex-end; }
    .message.ai   { justify-content: flex-start; }
    .message.fading { opacity: 0 !important; transition: opacity 1.8s ease; }

    @keyframes msgIn {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .bubble {
      max-width: 38vw;
      font-size: 13px;
      line-height: 1.7;
      letter-spacing: 0.01em;
    }
    .message.user .bubble { text-align: right; color: #2A5360; }
    .message.ai   .bubble { text-align: left;  color: #04757B; }

    .scene {
      position: relative;
      width: 620px;
      height: 620px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      pointer-events: none;
    }

    #watercolorCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: -1;
    }

    #blobSvg {
      width: 400px;
      height: 400px;
      overflow: visible;
      cursor: pointer;
      pointer-events: all;
    }

    .input-wrap {
      position: absolute;
      bottom: 112px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      z-index: 10;
      width: 260px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .input-wrap.visible {
      opacity: 1;
      pointer-events: all;
      transform: translateX(-50%) translateY(0);
    }
    .ghost-input {
      width: 100%;
      background: transparent;
      border: none;
      border-bottom: 1.5px solid #D4C1B3;
      outline: none;
      font-family: 'Georgia', serif;
      font-size: 13px;
      color: #2A5360;
      padding: 4px 2px;
      text-align: center;
      letter-spacing: 0.04em;
      caret-color: #04757B;
    }
    .ghost-input::placeholder { color: #D4C1B3; font-style: italic; }
  </style>
</head>
<body>

  <header class="header">
    <span class="header-name">A.D.</span>
  </header>

  <nav class="nav-bubbles">
    <a href="https://capable-feet-e88.notion.site/Angela-Dong-20742836d467800fa350fa595744113f" class="nav-bubble" id="bubble-notion">
      <svg viewBox="0 0 90 56"><path d="M 45,4 C 56,2 72,6 78,14 C 84,22 84,36 78,44 C 72,52 56,56 45,54 C 34,56 18,52 12,44 C 6,36 6,22 12,14 C 18,6 34,2 45,4 Z"/></svg>
      <span>Notion</span>
    </a>
    <a href="https://www.linkedin.com/in/angelaadongg/" class="nav-bubble" id="bubble-linkedin">
      <svg viewBox="0 0 90 56"><path d="M 45,3 C 57,1 74,8 80,16 C 86,24 85,38 78,46 C 71,54 55,57 44,55 C 33,57 17,53 11,45 C 5,37 5,22 11,14 C 17,6 33,5 45,3 Z"/></svg>
      <span>LinkedIn</span>
    </a>
    <a href="mailto:angelaadongg@gmail.com" class="nav-bubble" id="bubble-contact">
      <svg viewBox="0 0 90 56"><path d="M 45,5 C 58,3 73,9 79,17 C 85,25 84,40 77,48 C 70,56 54,58 43,56 C 32,58 16,54 10,46 C 4,38 5,23 11,15 C 17,7 32,7 45,5 Z"/></svg>
      <span>Contact</span>
    </a>
  </nav>

  <canvas id="watercolorCanvas"></canvas>

  <div class="chat-history" id="chatHistory">
    <div class="messages-wrap" id="messagesWrap"></div>
  </div>

  <div class="scene" id="scene">
    <svg id="blobSvg" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="fillGrad" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#2A5360" stop-opacity="0.22"/>
          <stop offset="50%"  stop-color="#04757B" stop-opacity="0.18"/>
          <stop offset="100%" stop-color="#53ABA9" stop-opacity="0.25"/>
        </linearGradient>
        <linearGradient id="strokeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
          <stop offset="0%"   stop-color="#2A5360"/>
          <stop offset="50%"  stop-color="#04757B"/>
          <stop offset="100%" stop-color="#53ABA9"/>
        </linearGradient>
        <filter id="watercolor" x="-20%" y="-20%" width="140%" height="140%">
          <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" seed="2" result="noise"/>
          <feDisplacementMap in="SourceGraphic" in2="noise" scale="8" xChannelSelector="R" yChannelSelector="G"/>
        </filter>
      </defs>
      <path id="blobFill"   fill="url(#fillGrad)" filter="url(#watercolor)"/>
      <path id="blobStroke" fill="none" stroke="url(#strokeGrad)" stroke-width="1" stroke-opacity="0.2"/>
    </svg>
    <div class="input-wrap" id="inputWrap">
      <input class="ghost-input" id="ghostInput" type="text" placeholder="ask me anything..." autocomplete="off"/>
    </div>
  </div>

  <script type="module" src="script.js"></script>

</body>
</html>
